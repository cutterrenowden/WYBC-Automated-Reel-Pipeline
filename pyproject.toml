[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reelpipe"
version = "0.2.4"
description = "cut reels out of long broadcasts using whisper + an llm"
readme = "README.md"
# otio has no 3.14 wheels yet, so cap it
requires-python = ">=3.11,<3.14"
# otio ships json only these days, the editorial adapters live in their own packages
dependencies = ["opentimelineio>=0.17", "otio-fcp-adapter>=1.0", "otio-cmx3600-adapter>=1.0", "pillow>=10.1"]

[project.optional-dependencies]
# apple silicon: gpu whisper via mlx
apple = ["mlx-whisper>=0.4"]
# everywhere else: cpu/cuda whisper via ctranslate2
generic = ["faster-whisper>=1.1"]
# only needed if you pay per token instead of pasting
api = ["openai>=1.40", "anthropic>=0.34"]
# the desktop window
app = ["pywebview>=5.1", "certifi>=2024.0"]
# bundling the desktop app into a double-clickable build
build = ["pyinstaller>=6.10", "static-ffmpeg>=2.5"]
dev = ["pytest>=8"]

[project.scripts]
reelpipe = "reelpipe.cli:main"

[project.gui-scripts]
reelpipe-app = "reelpipe.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"reelpipe.app" = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
