# builds the desktop app on real windows and mac runners and attaches the zips
# to a github release. fires when a version tag lands (gh release create does that),
# or run it by hand against an existing release:
#   gh workflow run release-builds.yml -f tag=v0.1.0

name: release-builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing release tag to attach builds to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: install
        run: pip install -e ".[generic,app,build]"
      - name: bundle ffmpeg
        run: python packaging/fetch_ffmpeg.py
      - name: build
        run: pyinstaller --noconfirm packaging/reelpipe-app.spec
      - name: build installer
        run: |
          choco install innosetup -y --no-progress
          $ver = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVer=$ver packaging\reelpipe.iss
      - name: attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload --clobber "${{ inputs.tag || github.ref_name }}" ReelPipe-Windows-Setup.exe

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: install
        run: pip install -e ".[apple,app,build]"
      - name: bundle ffmpeg
        run: python packaging/fetch_ffmpeg.py
      - name: build
        run: pyinstaller --noconfirm packaging/reelpipe-app.spec
      - name: package dmg
        run: |
          mkdir dmg-root
          cp -R dist/ReelPipe.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname ReelPipe -srcfolder dmg-root -ov -format UDZO ReelPipe-macOS.dmg
      - name: attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload --clobber "${{ inputs.tag || github.ref_name }}" ReelPipe-macOS.dmg
